# The tunnel sends /hooks/* directly to the existing deploy service.
# Use a separate public path and map only this exact endpoint to the API.
ProxyPassMatch "^/monitoring-hooks/(github/actions)$" "http://admin-api:8080/hooks/$1" connectiontimeout=5 timeout=20
<LocationMatch "^/internal(?:/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "^/monitoring-hooks/github/actions$">
    LimitRequestBody 2000000
    Header always set Cache-Control "no-store"
</LocationMatch>
