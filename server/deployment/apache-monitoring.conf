# Include before the existing /hooks/ catch-all forwarding to the deploy service.
ProxyPassMatch "^(/hooks/github/actions)$" "http://admin-api:8080$1" connectiontimeout=5 timeout=20
<LocationMatch "^/internal(?:/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "^/hooks/github/actions$">
    LimitRequestBody 2000000
    Header always set Cache-Control "no-store"
</LocationMatch>
