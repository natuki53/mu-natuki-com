services:
  apache:
    volumes:
      - ./server-status/data:/usr/local/apache2/htdocs/api:ro
      - ./server-status/apache-status-cache.conf:/usr/local/apache2/conf/extra/server-status-cache.conf:ro

  status-collector:
    image: python:3.13-alpine
    container_name: server-status-collector
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NETDATA_BASE_URL: http://127.0.0.1:19999
      STATUS_OUTPUT_PATH: /data/server-status.json
      STATUS_INTERVAL_SECONDS: "1"
      STATUS_REQUEST_TIMEOUT_SECONDS: "3"
      TZ: Asia/Tokyo
    command: ["python", "/app/status-collector.py"]
    volumes:
      - ./server-status/status-collector.py:/app/status-collector.py:ro
      - ./server-status/data:/data

  bot-status-collector:
    image: python:3.13-alpine
    container_name: bot-status-collector
    restart: unless-stopped
    network_mode: none
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BOT_STATUS_SOURCES_ROOT: /sources
      BOT_STATUS_OUTPUT_PATH: /data/bot-status.json
      BOT_STATUS_INTERVAL_SECONDS: "5"
      BOT_STATUS_STALE_AFTER_SECONDS: "35"
      TZ: Asia/Tokyo
    command: ["python", "/app/bot-status-collector.py"]
    volumes:
      - ./server-status/bot-status-collector.py:/app/bot-status-collector.py:ro
      - ./server-status/data:/data
      - /home/natuki/services/runtime-status/timecard:/sources/timecard:ro
      - /home/natuki/services/runtime-status/voicevox-tts:/sources/voicevox-tts:ro
      - /home/natuki/services/runtime-status/youtube:/sources/youtube:ro

  web-app-status-collector:
    image: python:3.13-alpine
    container_name: web-app-status-collector
    restart: unless-stopped
    network_mode: bridge
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      WEB_APP_STATUS_OUTPUT_PATH: /data/web-app-status.json
      WEB_APP_STATUS_INTERVAL_SECONDS: "30"
      WEB_APP_STATUS_REQUEST_TIMEOUT_SECONDS: "5"
      TZ: Asia/Tokyo
    command: ["python", "/app/web-app-status-collector.py"]
    volumes:
      - ./server-status/web-app-status-collector.py:/app/web-app-status-collector.py:ro
      - ./server-status/data:/data
