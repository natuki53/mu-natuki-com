<Location "/api/server-status.json">
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    Header always set Cloudflare-CDN-Cache-Control "no-store"
    Header always set CDN-Cache-Control "no-store"
    Header always set Pragma "no-cache"
    Header always set Expires "0"
</Location>

<Location "/api/bot-status.json">
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    Header always set Cloudflare-CDN-Cache-Control "no-store"
    Header always set CDN-Cache-Control "no-store"
    Header always set Pragma "no-cache"
    Header always set Expires "0"
</Location>

<Location "/api/web-app-status.json">
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    Header always set Cloudflare-CDN-Cache-Control "no-store"
    Header always set CDN-Cache-Control "no-store"
    Header always set Pragma "no-cache"
    Header always set Expires "0"
</Location>

ProxyPass        "/api/admin/" "http://admin-api:8080/api/admin/" connectiontimeout=5 timeout=75
ProxyPassReverse "/api/admin/" "http://admin-api:8080/api/admin/"

<Location "/api/admin/">
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    Header always set Cloudflare-CDN-Cache-Control "no-store"
    Header always set CDN-Cache-Control "no-store"
    Header always set Pragma "no-cache"
    Header always set Expires "0"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
</Location>

<Location "/admin/">
    Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    Header always set Cloudflare-CDN-Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
</Location>
